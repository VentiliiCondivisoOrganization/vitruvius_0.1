<!doctype html>
<!--
  Vitruvius — Open Graph / social share card (1200×630).
  Rendered to static/og-image.png by scripts/brand/render-brand-assets.mjs.
  Edit here, then re-run the render script.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<style>
			:root {
				--ink: #0a0f1e;
				--ink-2: #0e1730;
				--line: #1c2c4d;
				--vellum: #f4eee1;
				--slate: #93a3c0;
				--cyan: #5bc4de;
			}
			* {
				margin: 0;
				box-sizing: border-box;
			}
			html,
			body {
				width: 1200px;
				height: 630px;
			}
			.card {
				position: relative;
				width: 1200px;
				height: 630px;
				overflow: hidden;
				background:
					radial-gradient(120% 120% at 100% 0%, #16264c 0%, rgba(22, 38, 76, 0) 55%),
					linear-gradient(160deg, #0c1430 0%, #090d1a 100%);
				font-family:
					'Geist',
					'Inter',
					system-ui,
					-apple-system,
					'Segoe UI',
					Roboto,
					Arial,
					sans-serif;
				color: var(--vellum);
			}
			/* blueprint grid */
			.grid {
				position: absolute;
				inset: 0;
				background-image:
					linear-gradient(to right, rgba(91, 196, 222, 0.06) 1px, transparent 1px),
					linear-gradient(to bottom, rgba(91, 196, 222, 0.06) 1px, transparent 1px);
				background-size: 48px 48px;
				-webkit-mask-image: radial-gradient(80% 90% at 20% 30%, #000 35%, transparent 80%);
				mask-image: radial-gradient(80% 90% at 20% 30%, #000 35%, transparent 80%);
			}
			/* large construction arc, right side */
			.arc {
				position: absolute;
				right: -160px;
				top: -160px;
				width: 620px;
				height: 620px;
				border-radius: 50%;
				border: 1.5px solid rgba(91, 196, 222, 0.16);
			}
			.arc.inner {
				right: -60px;
				top: -60px;
				width: 420px;
				height: 420px;
				border-color: rgba(230, 152, 47, 0.16);
			}
			.content {
				position: absolute;
				inset: 0;
				padding: 78px 80px;
				display: flex;
				flex-direction: column;
				justify-content: space-between;
			}
			.lockup {
				display: flex;
				align-items: center;
				gap: 18px;
			}
			.wordmark {
				font-size: 40px;
				font-weight: 800;
				letter-spacing: 4px;
			}
			.headline {
				font-size: 67px;
				font-weight: 800;
				line-height: 1.04;
				letter-spacing: -1.5px;
				max-width: 880px;
			}
			.headline .accent {
				background: linear-gradient(100deg, #f4cc7c 0%, #e6982f 45%, #bc5326 100%);
				-webkit-background-clip: text;
				background-clip: text;
				-webkit-text-fill-color: transparent;
			}
			.footer {
				display: flex;
				align-items: center;
				justify-content: space-between;
			}
			.chip {
				display: inline-flex;
				align-items: center;
				gap: 12px;
				padding: 11px 20px;
				border: 1px solid var(--line);
				border-radius: 999px;
				background: rgba(14, 23, 48, 0.6);
				font-size: 17px;
				font-weight: 600;
				letter-spacing: 2.5px;
				color: var(--slate);
				text-transform: uppercase;
			}
			.dot {
				width: 9px;
				height: 9px;
				border-radius: 50%;
				background: var(--cyan);
			}
			.url {
				font-size: 19px;
				font-weight: 600;
				letter-spacing: 1px;
				color: var(--slate);
			}
		</style>
	</head>
	<body>
		<div class="card">
			<div class="grid"></div>
			<div class="arc"></div>
			<div class="arc inner"></div>
			<div class="content">
				<div class="lockup">
					<svg width="62" height="62" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
						<defs>
							<linearGradient id="v" x1="11" y1="13" x2="33" y2="38" gradientUnits="userSpaceOnUse">
								<stop offset="0" stop-color="#F4CC7C" />
								<stop offset=".48" stop-color="#E6982F" />
								<stop offset="1" stop-color="#BC5326" />
							</linearGradient>
						</defs>
						<path
							d="M13 12.5 A 16 16 0 0 1 35 12.5"
							fill="none"
							stroke="#5BC4DE"
							stroke-width="2.2"
							stroke-linecap="round"
						/>
						<path
							d="M11 13 L24 38 L37 13"
							fill="none"
							stroke="url(#v)"
							stroke-width="5.4"
							stroke-linecap="round"
							stroke-linejoin="round"
						/>
						<circle cx="24" cy="38" r="2.4" fill="#5BC4DE" />
					</svg>
					<span class="wordmark">VITRUVIUS</span>
				</div>

				<h1 class="headline">
					From assembly video<br />
					to a manual you can <span class="accent">trust</span>.
				</h1>

				<div class="footer">
					<span class="chip"><span class="dot"></span>AI-Drafted · Human-Perfected</span>
					<span class="url">vitruvius.app</span>
				</div>
			</div>
		</div>
	</body>
</html>
