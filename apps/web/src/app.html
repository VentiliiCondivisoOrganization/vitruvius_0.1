<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />

		<!-- Brand: Vitruvius — AI-drafted assembly manuals, perfected by you. -->
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#0a0f1e" />
		<meta
			name="description"
			content="Turn an assembly video into an editable, step-by-step instruction manual: AI drafts it, you perfect it."
		/>

		<!-- Icons -->
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
		<link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />

		<!-- Open Graph -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Vitruvius" />
		<meta property="og:title" content="Vitruvius: AI-Drafted Assembly Manuals" />
		<meta
			property="og:description"
			content="From assembly video to a manual you can trust. AI drafts the steps; a guided editor lets you perfect them."
		/>
		<meta property="og:image" content="/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Vitruvius: AI-Drafted Assembly Manuals" />
		<meta
			name="twitter:description"
			content="From assembly video to a manual you can trust. AI drafts the steps; a guided editor lets you perfect them."
		/>
		<meta name="twitter:image" content="/og-image.png" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
