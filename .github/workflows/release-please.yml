name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Act as the org-owned GitHub App, not GITHUB_TOKEN: the default token is barred
      # from opening PRs ("GitHub Actions is not permitted to create or approve pull
      # requests") and its tags can't trigger deploy.yml. Mint a short-lived installation
      # token inline so there's no third-party action to pin.
      - name: Mint GitHub App token
        id: app
        env:
          APP_ID: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now=$(date +%s)
          header=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
          payload=$(printf '{"iat":%s,"exp":%s,"iss":"%s"}' "$((now - 60))" "$((now + 540))" "$APP_ID" | b64url)
          signing_input="${header}.${payload}"
          signature=$(printf '%s' "$signing_input" | openssl dgst -sha256 -sign <(printf '%s' "$PRIVATE_KEY") | b64url)
          jwt="${signing_input}.${signature}"
          install_id=$(curl -sf -H "Authorization: Bearer ${jwt}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/installation" | jq -r .id)
          token=$(curl -sf -X POST -H "Authorization: Bearer ${jwt}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/app/installations/${install_id}/access_tokens" | jq -r .token)
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version-file: .node-version

      # Run the CLI pinned to an exact version (matches the config $schema) instead of a
      # floating action tag — immutable, no third-party action to pin.
      - env:
          RP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          npx --yes release-please@17.1.3 release-pr --token="$RP_TOKEN" --repo-url="$GITHUB_REPOSITORY" --config-file=release-please-config.json --manifest-file=.release-please-manifest.json
          npx --yes release-please@17.1.3 github-release --token="$RP_TOKEN" --repo-url="$GITHUB_REPOSITORY" --config-file=release-please-config.json --manifest-file=.release-please-manifest.json
