name: 'Needed jobs succeeded'
description: |
  Checks that the jobs needed by the current job succeeded.

  If one of the needed jobs fails, GitHub will by default skip the
  current job and consider a skipped job to be successful.  If
  instead you wish the current job to fail if any job needed by
  the current one fails, you need to:

  - set the current job to always run. (use: `if: $ {{ always() }}`)
  - check the result of all the needed jobs. (use this action)
inputs:
  needs:
    description: "JSON describing the needed jobs.  (use: `'$ {{ toJson(needs) }}'`)"
    required: true
runs:
  using: 'composite'
  steps:
    # This action IS the merge gate, so it must fail closed: `set -euo pipefail`
    # makes a `jq` error (malformed JSON, jq missing) abort the step instead of
    # leaving an empty result that would falsely read as "all green".
    - name: 'Check that we have inputs'
      shell: bash
      run: |
        set -euo pipefail
        all_jobs="$(printf '%s' "$NEEDS" | jq 'to_entries[]')"
        [[ -n "$all_jobs" ]] || {
           echo "ERROR: No needs found"
           exit 1
        }
      env:
        NEEDS: ${{ inputs.needs }}
    - name: "Check that all jobs in 'needs' are successful"
      shell: bash
      run: |
        set -euo pipefail
        unsuccessful_jobs="$(printf '%s' "$NEEDS" | jq 'to_entries[] | select(.value.result != "success")')"
        if [[ -z "$unsuccessful_jobs" ]]; then
          echo "All required jobs succeeded."
        else
          echo "Some required jobs did not succeed:"
          printf '%s\n' "$unsuccessful_jobs"
          exit 1
        fi
      env:
        NEEDS: ${{ inputs.needs }}
