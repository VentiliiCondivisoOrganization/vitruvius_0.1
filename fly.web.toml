app = "vitruvius"
primary_region = "ams"

# Required secrets (set with `fly secrets set ... -a vitruvius`):
#   PUBLIC_SUPABASE_URL, PUBLIC_SUPABASE_ANON_KEY
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET  (source video storage)

[build]
  dockerfile = "apps/web/Dockerfile"

[env]
  # With R2 configured, source videos upload directly browser→R2 in multipart parts
  # (spec 20), so the video bytes never hit this server and this limit no longer bounds
  # video size. It now only bounds the small aux files (BOM/CAD) and the server-proxied
  # fallback used when R2 is absent (local dev). Kept comfortably below VM memory (below)
  # so a single oversized POST on any route cannot OOM the machine.
  # Note: direct R2 upload needs bucket CORS allowing PUT + exposing ETag — see
  # scripts/set-r2-cors.mjs.
  BODY_SIZE_LIMIT = "512M"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  # adapter-node buffers the request body in memory for form uploads, and
  # multipart parsing adds overhead on top of the raw body. Keep memory well
  # above BODY_SIZE_LIMIT (512M) so a peak upload — plus the Node baseline and
  # some concurrency — has headroom and does not OOM.
  size = "shared-cpu-1x"
  memory = "2gb"
