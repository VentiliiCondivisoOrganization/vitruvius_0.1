# Override at deploy time via: fly deploy -a <app-name>
app = "vitruvius-web"
primary_region = "ams"

[build]
  dockerfile = "apps/web/Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
