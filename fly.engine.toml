app = "vitruvius-engine"
primary_region = "ams"

# Required secrets (set with `fly secrets set ... -a vitruvius-engine`):
#   PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, GEMINI_API_KEY
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET  (source video storage)

[build]
  dockerfile = "apps/engine/Dockerfile"

# The media stage downloads the full source video and runs ffmpeg (scene detection +
# keyframe extraction), which is memory-heavy. Fly's 256 MB default OOM-kills the worker
# mid-run; flyd then restarts the machine, orphaning the in-flight job. Give ffmpeg headroom.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
