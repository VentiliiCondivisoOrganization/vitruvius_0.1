name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Act as the org-owned GitHub App, not GITHUB_TOKEN: the default token is barred from
      # opening PRs ("GitHub Actions is not permitted to create or approve pull requests")
      # and its tags can't trigger deploy.yml.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version-file: .node-version

      # Run the CLI pinned to an exact version (matches the config $schema) instead of a
      # floating action tag — immutable, no third-party action to pin.
      - env:
          RP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          npx --yes release-please@17.1.3 release-pr --token="$RP_TOKEN" --repo-url="$GITHUB_REPOSITORY" --config-file=release-please-config.json --manifest-file=.release-please-manifest.json
          npx --yes release-please@17.1.3 github-release --token="$RP_TOKEN" --repo-url="$GITHUB_REPOSITORY" --config-file=release-please-config.json --manifest-file=.release-please-manifest.json
